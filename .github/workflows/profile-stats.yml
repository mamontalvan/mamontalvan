name: Update profile statistics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test workflow
        run: |
          echo "GitHub Actions is working correctly."
          mkdir -p assets
          echo "Profile statistics workflow is working." > assets/test.txt

      - name: Commit test file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/test.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: test profile statistics workflow"
            git push
          fi
